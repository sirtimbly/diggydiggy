name: publish-npm
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release with tested binaries and npm tarball
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-publish-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-22.04
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: jdx/mise-action@v5
        with:
          version: '2026.10.21'
      - name: Validate tag and download the existing package without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const {version} = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) process.exit(1);
          JS
          gh release download "$RELEASE_TAG" --pattern 'diggydiggy-*.tgz'
      - name: Verify the exact release tarball as a project dev dependency
        run: mise run smoke:package
      - name: Publish with npm trusted publishing
        run: mise run release:publish
